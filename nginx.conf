server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support for SPA routing
    location / {
        # Explicitly include mime types at this level as well
        include /etc/nginx/mime.types;
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|mp4|webm|ogg|mp3|wav|flac|aac)$ {
        include /etc/nginx/mime.types;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }
}
